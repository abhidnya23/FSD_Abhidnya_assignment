name: Deploy Assignments

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Assignment 4
        working-directory: assignment_4
        run: |
          npm ci
          npm run build

      - name: Build Assignment 5
        working-directory: assignment_5
        run: |
          npm ci
          npm run build

      - name: Build Assignment 6
        working-directory: assignment_6
        run: |
          npm ci
          npm run build

      - name: Prepare website
        run: |
          mkdir -p site
          cp -r assignment_1 assignment_2 assignment_3 site/
          cp -r assignment_4 site/
          cp -r assignment_5 site/
          cp -r assignment_6 site/

          rm -rf site/assignment_4/src site/assignment_4/public
          rm -rf site/assignment_5/src site/assignment_5/public
          rm -rf site/assignment_6/src site/assignment_6/public

          cp -r assignment_4/dist/. site/assignment_4/
          cp -r assignment_5/dist/. site/assignment_5/
          cp -r assignment_6/dist/. site/assignment_6/

          rm -rf site/assignment_4/dist
          rm -rf site/assignment_5/dist
          rm -rf site/assignment_6/dist

          cp index.html site/ 2>/dev/null || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
